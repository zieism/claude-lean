name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }    # 3.8 is no longer provisioned on ubuntu-latest
          - { os: ubuntu-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Unit tests (stdlib only)
        run: python -m unittest -v tests/test_toolkit.py
